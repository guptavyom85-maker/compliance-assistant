{% extends "base.html" %}
{% block content %}
<h1 class="h3">Upload a document</h1>
<p>PDFs must contain readable text. Select the source category accurately: a consultation paper or report is not a binding regulation. For a company policy, leave the regulator blank.</p>
<form method="post" enctype="multipart/form-data">{% csrf_token %}{{ form.as_p }}<button class="btn btn-primary">Upload PDF</button></form>
{% endblock %}
